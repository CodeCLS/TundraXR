<!-- @dsCard group="Colors" viewport="700x150" name="Cobalt accent" subtitle="The single accent — desaturated to sit inside the warm-grey family" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--cobalt-050);color:var(--ink-800)"><span class="n">--cobalt-050</span><span class="v">#EDF4F7</span></div><div class="sw" style="background:var(--cobalt-100);color:var(--ink-800)"><span class="n">--cobalt-100</span><span class="v">#DCE4F2</span></div><div class="sw" style="background:var(--cobalt-300);color:var(--ink-800)"><span class="n">--cobalt-300</span><span class="v">#9CADD0</span></div><div class="sw" style="background:var(--cobalt-500);color:var(--cream-050)"><span class="n">--cobalt-500</span><span class="v">#5A6E9E</span></div><div class="sw" style="background:var(--cobalt-700);color:var(--cream-050)"><span class="n">--cobalt-700</span><span class="v">#42527C</span></div><div class="sw" style="background:var(--cobalt-900);color:var(--cream-050)"><span class="n">--cobalt-900</span><span class="v">#2A3452</span></div>
</div></body></html>
