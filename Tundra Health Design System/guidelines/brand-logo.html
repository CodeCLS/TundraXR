<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row" style="gap:12px">
<div style="flex:1;display:flex;align-items:center;justify-content:center;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background:var(--paper-000)"><img src="../assets/tundra-mark-ink.svg" alt="Tundra" style="height:26px"><span style="margin-left:11px;font:var(--weight-medium) 23px/1 var(--font-sans);letter-spacing:-.03em;color:var(--stone-700)">Tundra</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;height:120px;border-radius:var(--radius-lg);background:var(--stone-700)"><img src="../assets/tundra-mark.svg" alt="Tundra" style="height:26px"><span style="margin-left:11px;font:var(--weight-medium) 23px/1 var(--font-sans);letter-spacing:-.03em;color:var(--cream-100)">Tundra</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background:var(--cream-100)"><img src="../assets/tundra-mark-ink.svg" alt="Tundra mark" style="height:34px"></div>
</div></body></html>
