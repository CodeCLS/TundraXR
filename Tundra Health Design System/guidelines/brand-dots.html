<!-- @dsCard group="Brand" viewport="700x170" name="Dotted survey grid" subtitle="22px pitch, radially faded — the signature background" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row" style="gap:12px">
<div style="flex:1;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background-color:var(--paper-050);background-image:var(--pattern-dots);background-size:var(--dot-gap) var(--dot-gap)"></div>
<div style="flex:1;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background-color:var(--paper-050);background-image:var(--pattern-dots-soft);background-size:var(--dot-gap-tight) var(--dot-gap-tight)"></div>
<div style="flex:1;height:120px;border-radius:var(--radius-lg);background-color:var(--stone-700);background-image:var(--pattern-dots-inverse);background-size:var(--dot-gap) var(--dot-gap)"></div>
</div></body></html>
