<!-- @dsCard group="Colors" viewport="700x150" name="Brand cream" subtitle="Logo cream is artwork-only; --cream-surface is the band tone that sits on bone" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--cream-050);color:var(--ink-800)"><span class="n">--cream-050</span><span class="v">#FDFBF3</span></div><div class="sw" style="background:var(--cream-100);color:var(--ink-800)"><span class="n">--cream-100</span><span class="v">#F8F2DC · logo fill</span></div><div class="sw" style="background:var(--cream-200);color:var(--ink-800)"><span class="n">--cream-200</span><span class="v">#EFE6C7</span></div><div class="sw" style="background:var(--cream-300);color:var(--ink-800)"><span class="n">--cream-300</span><span class="v">#E2D6AE</span></div>
</div></body></html>
