<!-- @dsCard group="Colors" viewport="700x140" name="Hairlines" subtitle="Warm borders — structure comes from lines, not shadows" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:80px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--line-100);color:var(--ink-800)"><span class="n">--line-100</span><span class="v">#E8E4D8 · default</span></div><div class="sw" style="background:var(--line-200);color:var(--ink-800)"><span class="n">--line-200</span><span class="v">#DBD6C6 · control</span></div><div class="sw" style="background:var(--line-300);color:var(--ink-800)"><span class="n">--line-300</span><span class="v">#C7C1AE · strong</span></div>
</div></body></html>
