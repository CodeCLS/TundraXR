<!-- @dsCard group="Brand" viewport="700x170" name="Paper grain" subtitle="Fractal-noise overlay, multiply on light, overlay on ink" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row" style="gap:12px">
<div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background:var(--cream-100);overflow:hidden"><span style="position:absolute;inset:0;background-image:var(--grain-url);opacity:var(--grain-opacity);mix-blend-mode:multiply"></span></div>
<div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);border:1px solid var(--border-hairline);background:var(--bg-page);overflow:hidden"><span style="position:absolute;inset:0;background-image:var(--grain-url);opacity:var(--grain-opacity-strong);mix-blend-mode:multiply"></span></div>
<div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);background:var(--stone-700);overflow:hidden"><span style="position:absolute;inset:0;background-image:var(--grain-url);opacity:.5;mix-blend-mode:overlay"></span></div>
</div></body></html>
