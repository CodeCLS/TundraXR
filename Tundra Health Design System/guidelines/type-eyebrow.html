<!-- @dsCard group="Type" viewport="700x140" name="Micro-labels" subtitle="10.5px medium, .085em, uppercase — column heads, stat labels, section eyebrows" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="col" style="gap:12px">
<div style="display:flex;gap:22px"><span style="font:var(--weight-medium) 10.5px/1 var(--font-sans);letter-spacing:.085em;text-transform:uppercase;color:var(--text-secondary)">Asset tag</span><span style="font:var(--weight-medium) 10.5px/1 var(--font-sans);letter-spacing:.085em;text-transform:uppercase;color:var(--text-secondary)">Service history</span><span style="font:var(--weight-medium) 10.5px/1 var(--font-sans);letter-spacing:.085em;text-transform:uppercase;color:var(--text-secondary)">YTD cost</span></div>
<div class="lbl">What teams do with it</div>
<div style="font:var(--weight-regular) var(--text-caption)/1.5 var(--font-sans);color:var(--text-muted)">Row 1: the product micro-label — 10.5px medium, .085em, uppercase, muted. Row 2: the larger marketing eyebrow (--text-label, 11px / .09em).</div>
</div></body></html>
