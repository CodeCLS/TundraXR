<!-- @dsCard group="Colors" viewport="700x140" name="Stone" subtitle="The warm dark family — primary buttons, contrast bands, tooltips. Never black" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans)}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:80px;border-radius:var(--radius-md);padding:8px 9px;color:var(--cream-100)}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono)}.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.66}
</style></head><body><div style="display:flex;gap:10px">
<div class="sw" style="background:var(--stone-400)"><span class="n">--stone-400</span><span class="v">#78766C</span></div>
<div class="sw" style="background:var(--stone-500)"><span class="n">--stone-500</span><span class="v">#635F55 · hover</span></div>
<div class="sw" style="background:var(--stone-600)"><span class="n">--stone-600</span><span class="v">#55524A · primary, bands</span></div>
<div class="sw" style="background:var(--stone-700)"><span class="n">--stone-700</span><span class="v">#46443D · pressed</span></div>
<div class="sw" style="background:var(--stone-800)"><span class="n">--stone-800</span><span class="v">#35342E · body text</span></div>
</div></body></html>
