<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Barely-there shadows; hairlines do the real work" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row" style="gap:14px;padding:6px 0">
<div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:64px;background:var(--paper-000);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-hairline)"></div><span style="font:var(--weight-regular) 10px/1 var(--font-mono);color:var(--text-muted)">--shadow-hairline</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:64px;background:var(--paper-000);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span style="font:var(--weight-regular) 10px/1 var(--font-mono);color:var(--text-muted)">--shadow-sm</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:64px;background:var(--paper-000);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span style="font:var(--weight-regular) 10px/1 var(--font-mono);color:var(--text-muted)">--shadow-md</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:64px;background:var(--paper-000);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span style="font:var(--weight-regular) 10px/1 var(--font-mono);color:var(--text-muted)">--shadow-lg</span></div>
</div></body></html>
