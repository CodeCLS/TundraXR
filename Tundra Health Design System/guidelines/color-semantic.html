<!-- @dsCard group="Colors" viewport="700x180" name="Semantic text aliases" subtitle="Always reference these, not raw ink values" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="col" style="gap:9px">
<div style="font:var(--weight-medium) 20px/1.2 var(--font-sans);letter-spacing:-.02em;color:var(--text-display)">--text-display &nbsp;<span style="font:var(--weight-regular) 11px/1 var(--font-mono);color:var(--text-muted)">ink-900</span></div>
<div style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-body)">--text-body &nbsp;<span style="font:var(--weight-regular) 11px/1 var(--font-mono);color:var(--text-muted)">ink-800</span></div>
<div style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-secondary)">--text-secondary &nbsp;<span style="font:var(--weight-regular) 11px/1 var(--font-mono);color:var(--text-muted)">ink-500</span></div>
<div style="font:var(--weight-regular) 13.5px/1.4 var(--font-sans);color:var(--text-muted)">--text-muted &nbsp;<span style="font:var(--weight-regular) 11px/1 var(--font-mono)">ink-400</span></div>
<div style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-link)">--text-link &nbsp;<span style="font:var(--weight-regular) 11px/1 var(--font-mono);color:var(--text-muted)">cobalt-700</span></div>
</div></body></html>
