<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Device and SLA state: moss, amber, rust, glacier" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="col"><div class="row">
<div class="sw" style="background:var(--moss-500);color:var(--cream-050)"><span class="n">--moss-500</span><span class="v">in service</span></div><div class="sw" style="background:var(--amber-500);color:var(--cream-050)"><span class="n">--amber-500</span><span class="v">overdue</span></div><div class="sw" style="background:var(--rust-500);color:var(--cream-050)"><span class="n">--rust-500</span><span class="v">down</span></div><div class="sw" style="background:var(--cobalt-500);color:var(--cream-050)"><span class="n">--cobalt-500</span><span class="v">informational</span></div>
</div><div class="row">
<div class="sw" style="background:var(--moss-050);color:var(--moss-700)"><span class="n">--moss-050</span><span class="v">tint</span></div><div class="sw" style="background:var(--amber-050);color:var(--amber-700)"><span class="n">--amber-050</span><span class="v">tint</span></div><div class="sw" style="background:var(--rust-050);color:var(--rust-700)"><span class="n">--rust-050</span><span class="v">tint</span></div><div class="sw" style="background:var(--cobalt-050);color:var(--cobalt-700)"><span class="n">--cobalt-050</span><span class="v">tint</span></div>
</div></div></body></html>
