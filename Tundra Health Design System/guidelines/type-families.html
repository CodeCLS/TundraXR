<!-- @dsCard group="Type" viewport="700x170" name="Families" subtitle="Geist for everything, Geist Mono for anything countable" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="col" style="gap:14px">
<div><div class="lbl">--font-sans · Geist</div><div style="margin-top:6px;font:var(--weight-regular) 30px/1.1 var(--font-sans);letter-spacing:-.03em;color:var(--text-display)">Every device, every record</div></div>
<div><div class="lbl">--font-mono · Geist Mono</div><div style="margin-top:6px;font:var(--weight-regular) 22px/1.1 var(--font-mono);letter-spacing:-.01em;color:var(--text-display)">AST-441902 · WO-88412</div></div>
</div></body></html>
