<!-- @dsCard group="Colors" viewport="700x150" name="Ink & stone" subtitle="Warm neutral text and structure. Nothing in Tundra is black — stone-700 is the darkest surface" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--stone-700);color: var(--cream-100)"><span class="n">--ink-900</span><span class="v">#191917</span></div><div class="sw" style="background:var(--ink-700);color:var(--cream-100)"><span class="n">--ink-700</span><span class="v">#3C3C37</span></div><div class="sw" style="background:var(--ink-500);color:var(--cream-050)"><span class="n">--ink-500</span><span class="v">#6F6F69</span></div><div class="sw" style="background:var(--ink-400);color:var(--stone-700)"><span class="n">--ink-400</span><span class="v">#94948C</span></div><div class="sw" style="background:var(--ink-300);color:var(--ink-800)"><span class="n">--ink-300</span><span class="v">#B5B5AD</span></div><div class="sw" style="background:var(--ink-200);color:var(--ink-800)"><span class="n">--ink-200</span><span class="v">#D4D4CC</span></div>
</div></body></html>
