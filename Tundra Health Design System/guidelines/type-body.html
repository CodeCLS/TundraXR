<!-- @dsCard group="Type" viewport="700x190" name="Body scale" subtitle="17 / 15 / 13.5 / 12 px — UI default is 13.5" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:10px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);padding:8px 9px;overflow:hidden}
.n{font:var(--weight-medium) 11px/1.25 var(--font-mono);letter-spacing:0}
.v{font:var(--weight-regular) 10px/1.3 var(--font-mono);opacity:.62}
.lbl{font:var(--weight-medium) var(--text-label)/1 var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-secondary)}
</style></head><body><div class="col" style="gap:9px">
<div style="font:var(--weight-regular) var(--text-body-lg)/var(--lh-body-lg) var(--font-sans);color:var(--text-body)">Body large · 17 · marketing paragraphs</div>
<div style="font:var(--weight-regular) var(--text-size-body)/var(--lh-body) var(--font-sans);color:var(--text-body)">Body · 15 · prose and long-form app copy</div>
<div style="font:var(--weight-regular) var(--text-body-sm)/var(--lh-body-sm) var(--font-sans);color:var(--text-body)">Body small · 13.5 · the default size inside the product</div>
<div style="font:var(--weight-regular) var(--text-caption)/var(--lh-caption) var(--font-sans);color:var(--text-secondary)">Caption · 12 · helper text, provenance, timestamps</div>
</div></body></html>
