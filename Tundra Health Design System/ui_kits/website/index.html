<script type="text/babel">
/* Each section is isolated: a failure in one renders a placeholder in its place
   instead of unmounting the whole page. */
const SECTIONS = ['GraphSection','AskSection','RoutinesSection','UseCases','AnalysisSection'];
function Site(){
  const B = window.SectionBoundary;
  return (<>
    <B><SiteHeader/></B>
    <B><Hero/></B>
    {SECTIONS.map(n => { const C = window[n]; return <B key={n}>{C ? <C/> : null}</B>; })}
    <B><SiteFooter/></B>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script>
