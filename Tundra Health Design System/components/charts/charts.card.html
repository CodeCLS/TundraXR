<!-- @dsCard group="Components" viewport="700x500" name="Charts" subtitle="DotMatrix, Sparkline, LineChart, BarChart, DonutChart, ProgressBar" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-page);font-family:var(--font-sans)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Sparkline, LineChart, BarChart, DonutChart, DotMatrix, ProgressBar, StatTile, Card, SplitBarChart } = window.TundraHealthDesignSystem_1734d4;
const months=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb'];
const spend=[38,41,37,44,49,46,52,48,55,51,58,54];
const oop=[12,15,11,18,14,19,13,16,12,15,10,9];
const split=Array.from({length:96},(_,i)=>{const n=Math.abs((Math.sin(i*12.9898)*43758.5453)%1);
  return i<44 ? 4+n*9 : 8+((i-44)/52)*74+n*22;});
function Demo(){return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
    <StatTile label="Maintenance spend" value="$54k" delta="6.1%" deltaDirection="up" deltaTone="down" chart={<Sparkline data={spend} width={150} height={26}/>}/>
    <StatTile label="Out of contract" value="$9k" delta="18%" deltaDirection="down" deltaTone="ok" chart={<Sparkline data={oop} width={150} height={26} color="var(--rust-500)"/>}/>
    <StatTile label="PM completion" value="82" unit="%" chart={<ProgressBar value={82} tone="ok" height={6} style={{marginTop:8}}/>}/>
  </div>
  <Card title="Repair calls by month" meta="The signature dot-matrix column chart">
    <DotMatrix rows={12} valueFormat={v=>v+' calls'} data={months.map((m,i)=>({label:m,value:[64,71,66,80,77,84,79,88,92,86,95,91][i]}))}/>
  </Card>
  <Card title="Spend by month" meta="Contract vs. out-of-contract, $000s">
    <LineChart height={170} labels={months} markers reference={45} referenceLabel="Budget" valueFormat={v=>'$'+Math.round(v)+'k'} series={[{name:'Contract',data:spend},{name:'Out of contract',data:oop,color:'var(--rust-500)'},{name:'Prior year',data:[30,33,29,36,40,38,43,40,46,42,48,45],color:'var(--ink-400)',dashed:true}]}/>
  </Card>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
    <Card title="Spend by vendor"><BarChart horizontal valueFormat={v=>'$'+(v/1000).toFixed(0)+'k'} data={[{label:'Siemens',value:412000},{label:'Philips',value:288500},{label:'Getinge',value:96200},{label:'BD',value:54000}]}/></Card>
    <Card title="Fleet state"><DonutChart size={116} centerValue="6,412" centerLabel="devices" data={[{label:'In service',value:5880,color:'var(--moss-500)'},{label:'PM overdue',value:412,color:'var(--amber-500)'},{label:'Down',value:120,color:'var(--rust-500)'}]}/></Card>
  </div>
  <Card title="Split comparison" meta="Penalties recovered before and after enforcement">
    <SplitBarChart data={split} split={44} height={120} leftLabel="Unenforced" rightLabel="With Tundra"
      ticks={['Q1 24','Q1 25','Q2 26']} valueFormat={v => '$' + Math.round(v) + 'k'} />
  </Card>
</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
